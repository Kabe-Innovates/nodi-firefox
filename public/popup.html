<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nodi</title>
  <link rel="stylesheet" href="popup.css" />
  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div class="terminal-window">
    <header class="terminal-header">
      <div class="brand">
        <span class="prompt">></span>
        <h1>NODI_SYSTEM</h1>
      </div>
      <div class="system-status">
        <span id="status-text">STATUS: IDLE</span>
        <div id="status-indicator" class="blink"></div>
      </div>
    </header>

    <nav class="terminal-nav">
      <button id="view-home-tab" class="nav-item active" data-target="view-home">
        [ HOME ]
      </button>
      <button id="view-manage-tab" class="nav-item" data-target="view-manage">
        [ MANAGE ]
      </button>
    </nav>

    <main class="terminal-content">
      <!-- HOME VIEW -->
      <section id="view-home" class="view-panel active">

        <!-- POMODORO MODULE -->
        <div class="module timer-module">
          <div class="module-header">
            <span class="module-title">:: PROCESS_TIMER ::</span>
            <span id="timer-state-badge" class="badge">WAITING</span>
          </div>

          <div class="timer-display-area">
            <div id="timer-time" class="xxl-text">25:00</div>
            <div class="timer-meta">
              <span>SESSION: <span id="timer-session">0</span></span>
            </div>
            <div class="progress-track">
              <div id="timer-progress-bar" class="progress-fill" style="width: 0%"></div>
            </div>
          </div>

          <div class="control-grid">
            <button id="timer-start" class="btn btn-primary">EXECUTE_FOCUS</button>
            <button id="timer-pause" class="btn btn-warning" style="display: none;">PAUSE_PROCESS</button>
            <button id="timer-resume" class="btn btn-primary" style="display: none;">RESUME_PROCESS</button>
            <button id="timer-reset" class="btn btn-danger">RESET</button>
          </div>

          <!-- Simplified Config: No options, just standard behavior implicit -->
          <div class="timer-info-footer">
            <span class="muted-text">STD_MODE: 25m FOCUS / 5m BREAK</span>
          </div>
        </div>

        <!-- SYSTEM STATUS MODULE -->
        <div class="module status-module">
          <div class="module-header">
            <span class="module-title">:: SYSTEM_CONTROL ::</span>
          </div>

          <div class="action-grid-sm">
            <button id="quick-monitoring-toggle" class="btn">TOGGLE_MONITOR</button>
            <button id="unlock-15" class="btn btn-warning">UNLOCK_15M</button>
          </div>
        </div>

      </section>

      <!-- MANAGE VIEW -->
      <section id="view-manage" class="view-panel">

        <div class="module zones-module">
          <div class="module-header">
            <span class="module-title">:: ZONE_MATRIX ::</span>
            <button id="add-zone" class="btn-text">[ + NEW_ZONE ]</button>
          </div>

          <div id="zones-list" class="zones-container">
            <!-- Zones injected here -->
            <div class="terminal-msg">No zones configured. Initiating...</div>
          </div>

          <!-- ADD/EDIT FORM -->
          <div id="zone-form" class="overlay-form" style="display: none;">
            <div class="form-header">
              <h3>>> ZONE_EDITOR</h3>
            </div>
            <input type="hidden" id="zone-form-id" />

            <div class="form-body">
              <div class="input-group">
                <label>ZONE_ID</label>
                <input type="text" id="zone-name" placeholder="OFFICE_MAIN">
              </div>

              <div class="input-group">
                <label>COORDINATES</label>
                <div class="row">
                  <input type="number" id="zone-lat" placeholder="LAT" step="0.0001">
                  <input type="number" id="zone-lon" placeholder="LON" step="0.0001">
                </div>
                <button id="zone-set-current-location" class="btn-sm mt-2">GET_GPS_DATA</button>
              </div>

              <div class="input-group">
                <label>RADIUS_METERS</label>
                <input type="number" id="zone-radius" value="50">
              </div>

              <div class="input-group">
                <label>BLOCK_LIST</label>
                <textarea id="zone-blocklist" rows="3" placeholder="youtube.com, facebook.com"></textarea>
              </div>

              <div class="input-group">
                <label>ALLOW_LIST</label>
                <textarea id="zone-allowlist" rows="2" placeholder="work.com"></textarea>
              </div>

              <div class="boolean-flags">
                <label class="checkbox-wrapper">
                  <input type="checkbox" id="zone-work-hours" />
                  <span class="checkmark">[ ]</span> WORK_HOURS_ONLY (09:00-17:00, Mon-Fri)
                </label>
              </div>

              <div class="input-group">
                <label>ZONE_COLOR</label>
                <input type="color" id="zone-color" value="#5b9ff5">
              </div>

              <div class="form-actions">
                <button id="save-zone" class="btn btn-primary">COMMIT</button>
                <button id="cancel-zone" class="btn btn-danger">ABORT</button>
              </div>
            </div>
          </div>
        </div>

        <div class="module stats-module" id="stats-section" style="display: none;">
          <div class="module-header">
            <span class="module-title">:: METRICS_LOG ::</span>
          </div>
          <div class="stats-text">
            <div>> SESSIONS_COMPLETED: <span id="stat-timer-sessions">0</span></div>
          </div>
          <div class="module-footer">
            <button id="reset-stats" class="btn-text">[ FLUSH_LOGS ]</button>
          </div>
        </div>

        <div class="module settings-module">
          <div class="module-header">
            <span class="module-title">:: DEBUG_GPS ::</span>
          </div>
          <div class="debug-controls">
            <button id="set-current-position" class="btn-sm">UPDATE_POS</button>
            <div class="log-line">LOC: <span id="current-position-display">UNKNOWN</span></div>
          </div>
          <div class="boolean-flags mt-2">
            <label class="checkbox-wrapper">
              <input type="checkbox" id="monitoring-enabled" checked>
              <span class="checkmark">[x]</span> MONITORING_ACTIVE
            </label>
          </div>
          <div id="feedback" class="console-output"></div>
        </div>

      </section>
    </main>

    <footer class="terminal-footer">
      <span>NODI v2.1 // MINIMAL_CORE</span>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="../dist/popup.js"></script>
</body>

</html>
